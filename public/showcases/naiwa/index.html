const N=DATA.length, $=id=>document.getElementById(id), clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),mix=(a,b,t)=>a+(b-a)*t;

const backup=DATA.map(d=>{const img=document.createElement('img');img.src=ART_BASE+d.file;img.alt=d.name;img.decoding='async';$('image-backup').append(img);return img});

function animateBackup(time=0){
  const p=telemetry.current, speed=clamp(Math.max(Math.abs(telemetry.velocity)*.6,telemetry.impulse*.7),0,.62);
  const mouseX=preferReduced?0:telemetry.px, mouseY=preferReduced?0:telemetry.py;
  const drift=preferReduced?0:telemetry.drift;
  backup.forEach((img,i)=>{
    const diff=i-p, side=i%2?-1:1;
    const depth=clamp(Math.abs(diff),0,1);
    const arrival=clamp(diff,0,1), departure=clamp(-diff,0,1);
    const opacity=diff>=0?1-ease(.16,1.05,diff):1-ease(.14,.83,-diff);
    const alive=preferReduced?0:Math.sin(time*.66+i*1.42);
    const dx=side*(arrival*7-departure*8)+mouseX*(2.0+speed*1.2);
    const dy=alive*.45-arrival*4.5+departure*5.5+drift*2.4-mouseY*1.3;
    const roll=preferReduced?0:side*(arrival*9-departure*10)+drift*2.5+alive*.4;
    const yaw=preferReduced?0:side*(arrival*19-departure*19)+mouseX*(4+speed*3);
    const pitch=preferReduced?0:-mouseY*(5+speed*2);
    const breathe=preferReduced?1:1+Math.sin(time*.92+i*1.7)*.012+speed*.055;

const vsBg=`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;

// A segmented image plane. Scroll energy bends the surface; stopping releases it.
// Textures are real remote image files, not generated placeholder images.
const artVertexShader = `
  precision highp float;
  varying vec2 vUv;
  uniform float uTime, uFlex, uIndex;
  void main(){
    vUv = uv;
    vec3 p = position;
    float edge = pow(abs(uv.x - .5)*2., 1.75);
    float envelope = sin(uv.x*3.14159265);
    float wave = sin(uv.y*10.5 + uTime*2.15 + uIndex*1.3);
    p.z += uFlex * (edge*.14 + wave*.035*envelope);
    p.x += uFlex * .045 * sin(uv.y*7. + uTime*1.9 + uIndex) * envelope;
    p.y += uFlex * .020 * sin(uv.x*8.4 - uTime*1.65) * envelope;
    gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.);
  }

const artFragmentShader = `
  precision highp float;
  varying vec2 vUv;
  uniform sampler2D uTexture;
  uniform float uTime, uFlex, uOpacity, uIndex;
  void main(){
    float envelope = sin(vUv.x*3.14159265);

// Semi-implicit spring: force toward target, damping leaves short physical follow-through.
function springPose(pose, name, target, dt, stiffness=MOTION.poseStiffness, damping=MOTION.poseDamping){
  if(preferReduced){pose[name]=target;pose[name+'V']=0;return target;}
  const key=name+'V';
  const acceleration=(target-pose[name])*stiffness-pose[key]*damping;
  pose[key]=clamp(pose[key]+acceleration*dt,-3.5,3.5);
  pose[name]+=pose[key]*dt;
  // 限制离开目标的过冲。主要运动来自目标轨迹，而非持续振荡。
  if((target-pose[name])*(target-(pose[name]-pose[key]*dt))<0){
    pose[name]=target;
    pose[key]=0;
  }
  return pose[name];
}

// Screen-space safety fit for the actual perspective camera. Even during quick

function constrainArtwork(camera,desiredX,desiredY,worldZ,rx,ry,rz,width,height,mobile){

    let minX=-Infinity,maxX=Infinity,minY=-Infinity,maxY=Infinity;
